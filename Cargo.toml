[workspace]
members = ["app", "pxdct-py"]
exclude = ["fuzz"]

[package]
name = "pxdct"
version = "0.3.6"
edition = "2024"
description = "Discrete cosine transform"
readme = "README.md"
keywords = ["dct", "discrete", "fourier"]
license = "BSD-3-Clause OR Apache-2.0"
authors = ["Radzivon Bartoshyk"]
documentation = "https://github.com/awxkee/pxdct"
categories = ["algorithms", "science"]
homepage = "https://github.com/awxkee/pxdct"
repository = "https://github.com/awxkee/pxdct"
exclude = ["*.jpg", "/assets", "*.png", "*.sh", "/assets/*", "/scripts/*"]
rust-version = "1.89.0"

[dependencies]
num-traits = "0.2.19"
num-complex = "0.4.6"
pxfm = "0.1.25"
zaft = "0.3"
num-integer = "0.1.46"

[dev-dependencies]
rand = "0.10.1"

[features]
default = ["avx", "neon"]
avx = ["zaft/avx"]
neon = ["zaft/neon"]
fcma = ["neon", "zaft/fcma"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
